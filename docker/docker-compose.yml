services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=mimic-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_namenode_rpc-address=namenode:8020
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - "namenode:/hadoop/dfs/name"
      - ./data:/data

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:8020
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on: [namenode]
    volumes: ["datanode:/hadoop/dfs/data"]

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=namenode:8020 namenode:9870 datanode:9864
    depends_on: [namenode, datanode]
    ports: ["8088:8088"]

  nodemanager:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    environment:
      - SERVICE_PRECONDITION=resourcemanager:8088
    depends_on: [resourcemanager]

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    command: /opt/hive/bin/hive --service metastore
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-postgresql:5432
    ports: ["9083:9083"]
    depends_on: [hive-metastore-postgresql]

  hiveserver2:
    image: bde2020/hive:2.3.2-postgresql-metastore
    environment:
      - SERVICE_PRECONDITION=hive-metastore:9083
    ports: ["10000:10000"]
    depends_on: [hive-metastore]

  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    ports: ["8080:8080", "7077:7077"]

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    depends_on: [spark-master]

volumes:
  namenode:
  datanode: